<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Segoe UI, Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a0"/></marker>
    <style>
      .t{font-weight:700;fill:#14213d}.s{fill:#3c4752;font-size:12px}.n{font-weight:700;fill:#fff;font-size:12px}
      .flow{stroke:#14213d;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .ops{stroke:#8a94a0;stroke-width:1.4;fill:none;stroke-dasharray:5 4;marker-end:url(#g)}
    </style>
  </defs>
  <rect width="1100" height="680" fill="#ffffff"/>

  <!-- User -->
  <rect x="15" y="250" width="135" height="80" rx="10" fill="#fff" stroke="#14213d" stroke-width="1.5"/>
  <text x="82" y="280" text-anchor="middle" class="t">Student / staff</text>
  <text x="82" y="298" text-anchor="middle" class="s">web browser</text>
  <text x="82" y="314" text-anchor="middle" class="s">(log in, ask Mabi)</text>

  <!-- CloudFront -->
  <rect x="180" y="235" width="205" height="110" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="285" y="262" text-anchor="middle" class="t">Amazon CloudFront</text>
  <text x="285" y="281" text-anchor="middle" class="s">HTTPS (free cloudfront.net cert)</text>
  <text x="285" y="297" text-anchor="middle" class="s">HTTP → HTTPS redirect</text>
  <text x="285" y="313" text-anchor="middle" class="s">CachingDisabled, global edge</text>
  <text x="285" y="331" text-anchor="middle" class="s" font-size="11">d2f1g5u307k6aa.cloudfront.net</text>

  <!-- Gemini -->
  <rect x="180" y="520" width="205" height="90" rx="10" fill="#fff4e0" stroke="#e9b44c" stroke-width="1.8"/>
  <text x="285" y="548" text-anchor="middle" class="t">Google Gemini API</text>
  <text x="285" y="566" text-anchor="middle" class="s">gemini-3.5-flash-lite</text>
  <text x="285" y="582" text-anchor="middle" class="s">free tier, outside AWS</text>
  <text x="285" y="598" text-anchor="middle" class="s">invented data only</text>

  <!-- Region -->
  <rect x="400" y="15" width="680" height="650" rx="14" fill="#f4f8fb" stroke="#1b998b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="418" y="40" class="t" fill="#1b998b">AWS account · region ap-southeast-1 (Singapore)</text>

  <!-- EC2 + SG -->
  <rect x="420" y="160" width="330" height="390" rx="12" fill="#fff" stroke="#d13212" stroke-width="1.8"/>
  <text x="435" y="184" class="t">EC2 nbu-itdesk-server</text>
  <text x="435" y="201" class="s">t3.small · Ubuntu 24.04 · ap-southeast-1c</text>
  <text x="435" y="217" class="s">Security group: port 80 from CloudFront only</text>
  <text x="435" y="233" class="s">No SSH port · IAM role NBU-EC2-Role</text>

  <rect x="440" y="250" width="290" height="78" rx="8" fill="#e6f5f3" stroke="#1b998b"/>
  <text x="585" y="274" text-anchor="middle" class="t">LibreChat container "Mabi"</text>
  <text x="585" y="292" text-anchor="middle" class="s">v0.8.9-rc1 + Northbridge reskin</text>
  <text x="585" y="308" text-anchor="middle" class="s">host :80 → :3080 · runs as uid 1000</text>
  <text x="585" y="322" text-anchor="middle" class="s" font-size="11">logs → CloudWatch (awslogs driver)</text>

  <rect x="440" y="360" width="290" height="70" rx="8" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="585" y="384" text-anchor="middle" class="t">MongoDB 8.0 container</text>
  <text x="585" y="402" text-anchor="middle" class="s">users, chats, messages · no published port</text>
  <text x="585" y="418" text-anchor="middle" class="s">data on EBS: deploy/aws/data-node</text>

  <rect x="440" y="450" width="290" height="88" rx="8" fill="#f7f7f7" stroke="#8a94a0"/>
  <text x="585" y="472" text-anchor="middle" class="t">systemd timers (automation)</text>
  <text x="585" y="490" text-anchor="middle" class="s">request logger + metrics · every 1 min</text>
  <text x="585" y="506" text-anchor="middle" class="s">auto-heal (/health) · every 1 min</text>
  <text x="585" y="522" text-anchor="middle" class="s">mongodump → S3 · nightly 02:00 Manila</text>

  <!-- right column services -->
  <g>
    <rect x="785" y="60" width="275" height="70" rx="8" fill="#eaf6ea" stroke="#3f8624"/>
    <text x="800" y="82" class="t">Amazon S3 bucket</text>
    <text x="800" y="100" class="s">content/ · IT Desk knowledge (versioned)</text>
    <text x="800" y="116" class="s">backups/mongodb/ · 14-day lifecycle</text>

    <rect x="785" y="145" width="275" height="55" rx="8" fill="#fde8ef" stroke="#c7254e"/>
    <text x="800" y="167" class="t">SSM Parameter Store</text>
    <text x="800" y="185" class="s">/nbu/librechat/GOOGLE_KEY (SecureString)</text>

    <rect x="785" y="215" width="275" height="85" rx="8" fill="#fde8ef" stroke="#c7254e"/>
    <text x="800" y="237" class="t">Amazon CloudWatch</text>
    <text x="800" y="255" class="s">5 log groups (14–30 day retention)</text>
    <text x="800" y="271" class="s">NBU/Mabi metrics · 9 alarms</text>
    <text x="800" y="287" class="s">dashboard Mabi-Operations</text>

    <rect x="785" y="315" width="275" height="55" rx="8" fill="#fde8ef" stroke="#c7254e"/>
    <text x="800" y="337" class="t">Amazon SNS nbu-alerts</text>
    <text x="800" y="355" class="s">ALARM and OK emails → admin inbox</text>

    <rect x="785" y="385" width="275" height="70" rx="8" fill="#fff4e0" stroke="#d97706"/>
    <text x="800" y="407" class="t">Lambda nbu-healthcheck</text>
    <text x="800" y="425" class="s">EventBridge every 5 min → GET /health</text>
    <text x="800" y="441" class="s">→ CloudFront · publishes HealthCheckOK</text>

    <rect x="785" y="470" width="275" height="55" rx="8" fill="#fde8ef" stroke="#c7254e"/>
    <text x="800" y="492" class="t">SSM Session Manager</text>
    <text x="800" y="510" class="s">admin shell in the browser (no SSH keys)</text>

    <rect x="785" y="540" width="275" height="110" rx="8" fill="#f7f7f7" stroke="#8a94a0"/>
    <text x="800" y="562" class="t">Account controls</text>
    <text x="800" y="580" class="s">Root: MFA, emergencies only</text>
    <text x="800" y="596" class="s">IAM user igor (MFA) → role NBU-Admin</text>
    <text x="800" y="612" class="s">CloudTrail nbu-trail (all regions)</text>
    <text x="800" y="628" class="s">AWS Budget $1/month alert</text>
  </g>
  <rect x="420" y="575" width="330" height="75" rx="8" fill="#fff" stroke="#14213d"/>
  <text x="435" y="597" class="t">Admin (on-call)</text>
  <text x="435" y="615" class="s">receives alarm emails · follows the runbook</text>
  <text x="435" y="631" class="s">connects only via Session Manager</text>

  <!-- question flow -->
  <path class="flow" d="M150,272 H178"/>
  <circle cx="164" cy="258" r="9" fill="#14213d"/><text x="164" y="262" text-anchor="middle" class="n">1</text>
  <path class="flow" d="M385,272 H438" marker-start="url(#a)"/>
  <circle cx="411" cy="258" r="9" fill="#14213d"/><text x="411" y="262" text-anchor="middle" class="n">2</text>
  <path class="flow" d="M585,328 V358" marker-start="url(#a)"/>
  <circle cx="602" cy="343" r="9" fill="#14213d"/><text x="602" y="347" text-anchor="middle" class="n">3</text>
  <path class="flow" d="M440,312 C405,340 400,500 386,545" marker-start="url(#a)"/>
  <circle cx="408" cy="440" r="9" fill="#14213d"/><text x="408" y="444" text-anchor="middle" class="n">4</text>
  <path class="flow" d="M178,310 H152"/>
  <circle cx="164" cy="324" r="9" fill="#14213d"/><text x="164" y="328" text-anchor="middle" class="n">5</text>

  <!-- ops lines -->
  <path class="ops" d="M730,262 H760 V96 H783"/>
  <path class="ops" d="M730,276 H766 V172 H783"/>
  <path class="ops" d="M730,300 H783"/>
  <path class="ops" d="M730,500 H772 V118 H783"/>
  <path class="ops" d="M922,300 V313"/>
  <path class="ops" d="M785,358 H778 V612 H752"/>
  <path class="ops" d="M1060,420 H1072 V258 H1062"/>

  <!-- legend -->
  <line x1="20" y1="640" x2="50" y2="640" stroke="#14213d" stroke-width="2.2"/><text x="56" y="644" class="s">a question's path (1–5)</text>
  <line x1="20" y1="660" x2="50" y2="660" stroke="#8a94a0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="56" y="664" class="s">operations: config, secrets, logs, backups, alerts</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
