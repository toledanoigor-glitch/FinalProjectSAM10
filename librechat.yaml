          --- 01-about-the-it-desk.md ---
          # About the Northbridge University IT Desk

          > All information in this document is invented for a student project (SAM10).
          > Northbridge University is a fictional university. Addresses, phone numbers, emails and
          > websites ending in .example do not exist.

          The IT Desk helps students and staff of Northbridge University (NBU) with accounts,
          passwords, Wi-Fi, email, software, printing and computer labs.

          ## Where to find us
          - Walk-in counter: Ground Floor, Room LB-104, Rizal Library Building
          - Landmark: to the left of the library entrance, beside the photocopy area
          - Wheelchair access: yes, via the library ramp

          ## Opening hours (walk-in and phone)
          | Day | Hours |
          |---|---|
          | Monday to Friday | 7:30 AM – 7:00 PM |
          | Saturday | 8:00 AM – 12:00 NN |
          | Sunday and public holidays | Closed |

          - During enrolment week and final exams week, the walk-in counter stays open until 9:00 PM
            Monday to Friday.
          - The online ticket portal is open 24/7, but tickets are only answered during opening hours.

          ## How to contact the IT Desk (all fictional)
          | Channel | Details | Best for |
          |---|---|---|
          | Ticket portal | NBU ServiceHub — https://servicehub.northbridge.example | Most requests; you get a ticket number |
          | Email | itdesk@northbridge.example | Creates a ticket automatically |
          | Phone | Local 4357 (spells HELP) from campus phones, or (02) 0000-4357 | Urgent problems |
          | Walk-in | Room LB-104 | Laptop and phone set-up, ID checks |

          Always bring your NBU ID card when you visit in person. For security, password and account
          recovery requests are only handled with a valid ID or through self-service.

          ## Response times (target)
          | Priority | Example | First response |
          |---|---|---|
          | Urgent | Whole class or office cannot log in; exam lab down | 1 working hour |
          | High | One person locked out before a deadline | 4 working hours |
          | Normal | Software install, printer problem | 1 working day |
          | Low | Questions, feature requests | 3 working days |

          ## What the IT Desk does not handle
          - Grades, enrolment status, scholarships or fees — contact the Registrar or the Cashier.
          - Personal devices that need hardware repair — we can give advice, but not open devices.
          - Social media accounts or personal email accounts that are not NBU accounts.

          --- 02-accounts-and-passwords.md ---
          # NBU Accounts, Passwords and MFA

          > Invented information for a student project.

          ## Your NBU account
          - Every student and staff member has one NBU account. It is used for Wi-Fi, email,
            the MyNBU student portal, NBU Drive, lab computers and printing.
          - Username format: your NBU ID number, for example 2026-12345 (students) or
            S-0456 (staff). Do not add @northbridge.example when logging in to lab computers.
          - New students: activate your account at https://activate.northbridge.example using your
            NBU ID number and the activation code printed on your enrolment form. Activation codes
            expire after 14 days; after that, visit the IT Desk with your NBU ID.

          ## Password rules
          - At least 12 characters.
          - Must include at least three of: uppercase letter, lowercase letter, number, symbol.
          - Cannot contain your name or ID number.
          - Cannot be one of your last 5 passwords.
          - Passwords expire every 180 days. You get reminder emails 14, 7 and 1 day before.
          - A passphrase such as "Purple-Mango-Rain-2026" is recommended.

          ## Forgot your password? (self-service reset)
          1. Go to https://password.northbridge.example
          2. Enter your NBU ID number.
          3. Choose to receive a code on your registered recovery email or mobile number.
          4. Enter the code and set a new password.
          5. Wait 5 minutes, then log in again on all your devices (including Wi-Fi on your phone).

          If you never registered a recovery email or number, bring your NBU ID to the IT Desk.
          IT staff will NEVER ask for your password by email, phone or chat.

          ## Account locked
          - After 5 wrong password attempts, your account is locked for 15 minutes.
          - It unlocks automatically. Waiting is the fastest fix.
          - A common cause is an old password saved on your phone's Wi-Fi or email app, which keeps
            trying in the background. Update or forget the saved password on every device.

          ## Multi-factor authentication (MFA)
          - MFA is required for all NBU accounts when logging in from outside campus.
          - Supported methods: an authenticator app (recommended), or an SMS code.
          - Set it up at https://mfa.northbridge.example
          - New phone? Add the new phone BEFORE you reset or give away the old one. If you have
            already lost the old phone, visit the IT Desk with your NBU ID to reset MFA.

          ## Account expiry
          - Students: your account stays active until 6 months after graduation. Email and NBU Drive
            files are deleted after that, so copy anything you want to keep.
          - Students on leave of absence: the account stays active for up to 1 year.
          - Staff: the account is disabled on the last working day.

          --- 03-wifi-and-network.md ---
          # Wi-Fi and Network

          > Invented information for a student project.

          ## Wi-Fi networks on campus
          | Network name | Who can use it | How to log in |
          |---|---|---|
          | NBU-Secure | Students and staff | NBU ID number + NBU password (WPA2/WPA3-Enterprise) |
          | NBU-Guest | Visitors | A guest code, valid 24 hours, requested by staff through ServiceHub |
          | NBU-Setup | Anyone | Open network that only lets you reach the set-up page; use it if you cannot connect to NBU-Secure |

          - Each NBU account can have up to 5 devices connected to NBU-Secure at the same time.
          - Coverage: all classrooms, the library, the cafeteria and the dorms. There is no coverage
            in the parking areas or on the sports field.

          ## Connecting to NBU-Secure
          **Windows 10/11:** Select NBU-Secure → enter NBU ID number and password → if asked to
          "Continue connecting?" about a certificate, check that the server name is
          radius.northbridge.example, then click Connect.

          **Android:** Choose NBU-Secure → EAP method: PEAP → Phase 2: MSCHAPV2 →
          CA certificate: "Use system certificates" → Domain: northbridge.example → Identity: your
          NBU ID number → Password: your NBU password.

          **iPhone / iPad:** Tap NBU-Secure → enter NBU ID number and password → tap Trust on the
          certificate for radius.northbridge.example.

          **Mac:** Choose NBU-Secure → enter NBU ID number and password → click Continue on the
          certificate for radius.northbridge.example.

          ## Common Wi-Fi problems
          | Problem | Try this |
          |---|---|
          | Password rejected after you changed your password | "Forget" NBU-Secure on the device and connect again with the new password |
          | Connected but no internet | Turn Wi-Fi off and on; check that the date and time on the device are correct |
          | Keeps disconnecting | Move closer to an access point; turn off "Private Wi-Fi address" only if IT asks you to |
          | Too many devices | Remove an old device at https://devices.northbridge.example |
          | Whole building has no Wi-Fi | Report it to the IT Desk as Urgent and say the building and room |

          ## Wired network (dorms and offices)
          - Each dorm room has one wired port. Register your device's MAC address at
            https://devices.northbridge.example before plugging in.
          - Game consoles and smart TVs cannot use NBU-Secure; register them for the wired port.
          - Personal Wi-Fi routers are not allowed on campus because they interfere with NBU Wi-Fi.

          ## VPN (off-campus access)
          - Use the NBU VPN to reach library databases and lab file shares from home.
          - Download the VPN client from https://vpn.northbridge.example and log in with your NBU
            account plus MFA.
          - The VPN is not needed for email, MyNBU or NBU Drive.

          --- 04-email-storage-and-software.md ---
          # Email, NBU Drive and Software

          > Invented information for a student project.

          ## NBU email
          - Student address: firstname.lastname@students.northbridge.example
          - Staff address: firstname.lastname@northbridge.example
          - Webmail: https://mail.northbridge.example (log in with NBU ID number and password)
          - Mailbox size: 50 GB for students, 100 GB for staff.
          - Attachment limit: 25 MB. For bigger files, share a link from NBU Drive.
          - Phone set-up: use the official mail app for your phone and choose "Work or school
            account", then sign in with your NBU email address.

          ## Phishing and suspicious emails
          - Do not click links or open attachments in unexpected emails asking for your password,
            payment, or "account verification".
          - Report it by forwarding the email to phishing@northbridge.example, then delete it.
          - If you already entered your password on a suspicious page: change your password
            immediately at https://password.northbridge.example and contact the IT Desk.

          ## NBU Drive (cloud storage)
          - 100 GB of cloud storage for every student and staff member.
          - Web access: https://drive.northbridge.example; desktop sync app available on the
            Software Portal.
          - Deleted files stay in the recycle bin for 30 days and can be restored by you.
          - After 30 days, the IT Desk can only restore files for staff, not for students.
          - Do not store other people's personal data in shared folders.

          ## Software Portal
          Free for current students and staff from https://software.northbridge.example :
          | Software | Who | Platforms |
          |---|---|---|
          | Office suite (documents, spreadsheets, slides) | Everyone | Windows, Mac, phones |
          | Antivirus | Everyone | Windows, Mac |
          | Statistics package | Students in Science, Business, Psychology | Windows, Mac |
          | CAD design software | Engineering and Architecture students | Windows only |
          | Programming tools (Python, an IDE, Git) | Everyone | Windows, Mac, Linux |

          - Licences end when you graduate or leave NBU.
          - Software that is not on the portal must be requested through ServiceHub by your
            department; the IT Desk cannot buy software for individual students.
          - Lab computers already have all portal software installed.

          --- 05-printing-and-labs.md ---
          # Printing and Computer Labs

          > Invented information for a student project. Prices are in Philippine pesos (PHP).

          ## PrintSmart (campus printing)
          - Every student gets 200 free pages per semester (black and white equivalent).
          - Prices after the free pages run out:
            | Type | Price per page |
            |---|---|
            | Black and white, A4 or Letter | 2 PHP |
            | Black and white, Long (8.5 x 13) | 3 PHP |
            | Colour, A4 or Letter | 8 PHP |
            | Colour, Long | 10 PHP |
          - Double-sided prints count as 2 pages.
          - Top up at the Cashier's Office or through MyNBU (e-wallet). Minimum top-up: 50 PHP.
          - Unused free pages do not carry over to the next semester. Paid credit does carry over.

          ## How to print
          1. From a lab computer: just print; choose the "PrintSmart" printer.
          2. From your own laptop: upload the file at https://print.northbridge.example
             (PDF, Word, images; max 50 MB).
          3. Go to any PrintSmart printer, tap your NBU ID card, and choose your job.
          4. Jobs are deleted if not printed within 24 hours.

          ## Printing problems
          | Problem | Try this |
          |---|---|
          | Job not showing at the printer | Wait 2 minutes; check you uploaded to PrintSmart, not another printer |
          | ID card not recognised | Use the printer screen to log in with your NBU ID number and password |
          | Paper jam or no toner | Use another printer and report the printer number to the IT Desk |
          | Charged for a failed print | Request a refund through ServiceHub within 7 days, with the printer number and time |

          ## Computer labs
          | Lab | Location | Hours | Notes |
          |---|---|---|---|
          | Lab A (General) | Rizal Library, 2nd floor | Mon–Fri 7:30 AM – 9:00 PM, Sat 8:00 AM – 5:00 PM | 60 Windows PCs, open to all |
          | Lab B (Mac) | Arts Building, Room 210 | Mon–Fri 8:00 AM – 6:00 PM | 30 Macs, open to all |
          | Lab C (Engineering) | Engineering Building, Room 305 | Mon–Fri 8:00 AM – 8:00 PM | CAD software; Engineering and Architecture students only |
          | 24-hour Lab | Dorm Hall 1, Ground Floor | Open 24/7 | 20 PCs; dorm residents only after 10:00 PM |

          ## Lab rules
          - Log in with your own NBU account only. Never share your login.
          - No food. Drinks only in bottles with lids.
          - Files saved on the lab computer's desktop are deleted when you log out. Save to NBU Drive
            or a USB drive.
          - Lab computers restart automatically at 3:00 AM every day.
          - Lost and found items from the labs are kept at the IT Desk for 30 days.
          - Classes have priority: during a scheduled class, only that class may use the lab.
            Lab schedules are posted at each lab door.

          --- 06-policies-and-faq.md ---
          # IT Policies and Frequently Asked Questions

          > Invented information for a student project.

          ## Acceptable use (summary)
          - Your NBU account is for your use only. Sharing your password is not allowed.
          - Do not try to access other people's accounts, files or devices.
          - Do not use NBU Wi-Fi for illegal downloading, hacking, or bothering other users.
          - Breaking these rules can lead to your account being suspended and the case being sent
            to the Office of Student Affairs. The IT Desk does not decide penalties.

          ## Lost or stolen devices
          - Change your NBU password right away at https://password.northbridge.example
          - Sign out of all sessions from https://myaccount.northbridge.example → Security.
          - If the device was an NBU-owned laptop (staff), report it to the IT Desk the same day.
          - For theft on campus, also report it to Campus Security.

          ## Personal laptop help
          - The IT Desk can help connect your laptop to Wi-Fi, set up email, install portal software
            and remove common malware, at the walk-in counter.
          - We do not repair hardware, replace screens or recover data from broken drives. We can
            suggest what to tell a repair shop.
          - Back up your files before handing over a device. The IT Desk is not responsible for data
            loss on personal devices.

          ## Frequently asked questions
          **Can the assistant reset my password for me?**
          No. Use self-service reset at https://password.northbridge.example or visit the IT Desk with
          your NBU ID. Nobody from IT will ask for your password.

          **How do I check the status of my ticket?**
          Log in to NBU ServiceHub and open "My tickets". Reply to the ticket email to add information.

          **Is there free Wi-Fi for my parents during graduation?**
          Yes. On graduation day, the open network "NBU-Graduation" is available around the venue.

          **Can I connect my smart TV or game console?**
          Not to Wi-Fi. Register it for the wired port in your dorm room.

          **My MyNBU portal shows the wrong grades or subjects. Can IT fix it?**
          No. The IT Desk does not change academic records. Contact the Registrar's Office.

          **How do I get a new NBU ID card?**
          Lost ID cards are replaced by the Registrar's Office for 150 PHP. Your printing credit moves
          to the new card automatically within 1 hour.

          **Is the IT Desk open during semester break?**
          Yes, Monday to Friday 8:00 AM – 5:00 PM. Saturday service is closed during breaks.

          **Where can I see planned maintenance or outages?**
          On the status page https://status.northbridge.example . Planned maintenance happens on
          Sundays between 12:00 MN and 6:00 AM.
